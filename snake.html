<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(160deg, #2b1d17, #4a2f23);
    color: #e8c88a;
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 20px;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  h1 { letter-spacing: 4px; font-weight: 500; margin: 0; }
  canvas { background: rgba(0,0,0,.4); border-radius: 10px; border: 1px solid rgba(232,200,138,.3); max-width: 90vw; }
  .tip { color: #c9a15a; font-size: 12px; letter-spacing: 1px; margin: 0; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 10px; }
  .pad button {
    height: 64px; font-size: 20px;
    background: rgba(232,200,138,.12);
    color: #e8c88a;
    border: 1px solid rgba(232,200,138,.35);
    border-radius: 12px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .pad button:active { background: rgba(232,200,138,.3); }
  .pad .empty { visibility: hidden; }
  a { color: #e8c88a; }
</style>
</head>
<body>
<h1>贪吃蛇</h1>
<canvas id="c" width="400" height="400"></canvas>
<p class="tip">键盘方向键　或 用下面的按钮</p>
<div class="pad">
  <button class="empty"></button>
  <button id="bU">↑</button>
  <button class="empty"></button>
  <button id="bL">←</button>
  <button id="bP">⏸</button>
  <button id="bR">→</button>
  <button class="empty"></button>
  <button id="bD">↓</button>
  <button class="empty"></button>
</div>
<p><a href="index.html">← 回到匣子</a></p>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const SIZE = 20, COLS = cv.width / SIZE, ROWS = cv.height / SIZE;
let snake, dir, nextDir, food, timer, score, paused, over;

function reset(){
  snake = [{x: 5, y: 10}, {x: 4, y: 10}, {x: 3, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  food = randFood();
  score = 0;
  paused = false;
  over = false;
  clearInterval(timer);
  timer = setInterval(step, 120);
  draw();
}
function randFood(){
  let p;
  do { p = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)}; }
  while (snake && snake.some(s => s.x === p.x && s.y === p.y));
  return p;
}
function step(){
  if (paused || over) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    over = true;
    clearInterval(timer);
    draw();
    setTimeout(() => alert('游戏结束！得分：' + score), 50);
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    food = randFood();
  } else {
    snake.pop();
  }
  draw();
}
function draw(){
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = 'rgba(232,200,138,.08)';
  for (let i = 0; i <= COLS; i++){
    ctx.beginPath(); ctx.moveTo(i*SIZE, 0); ctx.lineTo(i*SIZE, cv.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*SIZE); ctx.lineTo(cv.width, i*SIZE); ctx.stroke();
  }
  ctx.fillStyle = '#c9a15a';
  ctx.beginPath();
  ctx.arc(food.x*SIZE + SIZE/2, food.y*SIZE + SIZE/2, SIZE/2 - 3, 0, Math.PI*2);
  ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#e8c88a' : '#a87b4a';
    ctx.fillRect(s.x*SIZE + 1, s.y*SIZE + 1, SIZE - 2, SIZE - 2);
  });
  ctx.fillStyle = '#e8c88a';
  ctx.font = '16px system-ui';
  ctx.fillText('得分：' + score, 10, 20);
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#e8c88a';
    ctx.font = '24px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('已暂停', cv.width/2, cv.height/2);
    ctx.textAlign = 'start';
  }
}

/* 键盘 */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' && dir.x === 0) nextDir = {x: -1, y: 0};
  else if (e.key === 'ArrowRight' && dir.x === 0) nextDir = {x: 1, y: 0};
  else if (e.key === 'ArrowUp' && dir.y === 0) nextDir = {x: 0, y: -1};
  else if (e.key === 'ArrowDown' && dir.y === 0) nextDir = {x: 0, y: 1};
  else if (e.key === ' ') {
    if (over) { reset(); return; }
    paused = !paused;
    draw();
  }
});

/* 触屏按钮 */
function bindBtn(id, fn){
  const el = document.getElementById(id);
  el.addEventListener('click', e => { e.preventDefault(); fn(); });
}
bindBtn('bL', ()=>{ if (dir.x === 0) nextDir = {x: -1, y: 0}; });
bindBtn('bR', ()=>{ if (dir.x === 0) nextDir = {x: 1, y: 0}; });
bindBtn('bU', ()=>{ if (dir.y === 0) nextDir = {x: 0, y: -1}; });
bindBtn('bD', ()=>{ if (dir.y === 0) nextDir = {x: 0, y: 1}; });
bindBtn('bP', ()=>{ if (over) { reset(); return; } paused = !paused; draw(); });

reset();
</script>
</body>
</html>
